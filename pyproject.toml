[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clapon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "soundcard>=0.4.2",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/clapon"]
